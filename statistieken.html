<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Statistieken · Boodschappenlijst</title>
  <meta name="description" content="Hoe vaak en wanneer je gezin welke boodschappen koopt." />
  <meta name="theme-color" content="#2e7d32" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1a0f" media="(prefers-color-scheme: dark)" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__top">
        <h1>📊 Statistieken</h1>
        <span id="status-indicator" class="status" aria-live="polite">
          <span class="status__dot"></span>
          <span class="status__label">Verbinden…</span>
        </span>
      </div>

      <div id="stats-tabs" class="stats-tabs" role="tablist" aria-label="Weergave" hidden>
        <button type="button" role="tab" id="tab-maand" class="stats-tab" data-tab="maand"
                aria-selected="true" aria-controls="paneel-maand">📅 Per maand</button>
        <button type="button" role="tab" id="tab-product" class="stats-tab" data-tab="product"
                aria-selected="false" aria-controls="paneel-product">🛒 Per product</button>
      </div>
    </header>

    <main>
      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-state__emoji" aria-hidden="true">📈</p>
        <p>Nog geen aankoopgeschiedenis.</p>
        <p class="empty-state__hint">Vink een paar boodschappen af — dan verschijnen hier statistieken.</p>
      </div>

      <section id="paneel-maand" class="stats-panel" role="tabpanel" aria-labelledby="tab-maand" hidden>
        <label for="maand-categorie-filter" class="visually-hidden">Filter op categorie</label>
        <select id="maand-categorie-filter" class="stats-select"></select>
        <ul id="maand-lijst" class="stats-list"></ul>
        <p id="maand-leeg" class="empty-state__hint" hidden>
          Geen uitgaven met deze categorie.
        </p>
      </section>

      <section id="paneel-product" class="stats-panel" role="tabpanel" aria-labelledby="tab-product" hidden>
        <div class="stats-controls">
          <label for="product-zoek" class="visually-hidden">Zoek een product</label>
          <input id="product-zoek" type="search" class="stats-input"
                 placeholder="🔍 Zoek een product…" autocomplete="off" />
          <div class="stats-controls__row">
            <label for="product-categorie-filter" class="visually-hidden">Filter op categorie</label>
            <select id="product-categorie-filter" class="stats-select"></select>
            <label for="product-sorteer" class="visually-hidden">Sorteer op</label>
            <select id="product-sorteer" class="stats-select">
              <option value="aantal">Vaakst gekocht</option>
              <option value="uitgegeven">Meest uitgegeven</option>
              <option value="laatst">Laatst gekocht</option>
              <option value="naam">A–Z</option>
            </select>
          </div>
        </div>

        <p id="product-teller" class="stats-teller" aria-live="polite"></p>
        <ul id="stats-list" class="stats-list"></ul>
        <p id="product-leeg" class="empty-state__hint" hidden>Geen producten gevonden.</p>
        <button type="button" id="product-meer" class="btn btn--secondary stats-meer" hidden></button>
      </section>
    </main>

    <footer class="app-footer">
      <p><a id="producten-link" href="producten.html">🏷️ Categorieën corrigeren</a></p>
      <p><a id="winkels-link" href="winkels.html">🏬 Beheer winkels</a></p>
      <p><a id="terug-link" href="index.html">← Terug naar de lijst</a></p>
    </footer>
  </div>

  <script type="module" src="statistieken.js"></script>
</body>
</html>
